version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: lottery_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: "lottery_single"
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # mount SQL initialization scripts (use init folder to avoid failing inserts)
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.2-alpine
    container_name: lottery_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build: .
    container_name: lottery_app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8081:8081"
    volumes:
      # Mount a config tailored for docker environment so service addresses point to service names
      - ./configs/docker-config.yml:/app/configs/config.yml:ro
    environment:
      - GO_ENV=production
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
